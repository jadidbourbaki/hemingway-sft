[project]
name = "hemingway-sft"
version = "0.1.0"
description = "Supervised fine-tuning of a small open model on Hemingway's prose style."
requires-python = ">=3.11"
dependencies = [
    "accelerate==1.14.0",
    "anthropic==0.121.0",
    "datasets==5.0.1",
    "huggingface-hub==1.27.0",
    "peft==0.20.0",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.15.0",
    "trl==1.9.2",
]

[project.scripts]
hemingway-corpus = "hemingway_sft.corpus:main"
hemingway-instructions = "hemingway_sft.reverse_instructions:main"
hemingway-train = "hemingway_sft.train:main"
hemingway-evaluate = "hemingway_sft.evaluate:main"
hemingway-merge = "hemingway_sft.merge:main"
hemingway-publish = "hemingway_sft.publish:main"
hemingway-memorization = "hemingway_sft.memorization:main"
hemingway-style = "hemingway_sft.style:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hemingway_sft"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
    "ty==0.0.70",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
